name: Update Google Scholar Citations

on:
  # 每天 UTC 08:00 自动更新
  schedule:
    - cron: "0 8 * * *"

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Google Scholar citations
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          cd google_scholar_crawler
          python main.py

      - name: Verify generated file
        run: |
          test -f google_scholar_crawler/results/gs_data_shieldsio.json
          cat google_scholar_crawler/results/gs_data_shieldsio.json

      - name: Publish citation data
        run: |
          mkdir publish

          cp google_scholar_crawler/results/gs_data_shieldsio.json \
             publish/gs_data_shieldsio.json

          cd publish

          git init
          git checkout -b google-scholar-stats

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add gs_data_shieldsio.json
          git commit -m "Update Google Scholar citations"

          git remote add origin \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

          git push --force origin google-scholar-stats
