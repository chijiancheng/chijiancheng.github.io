name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Get Google Scholar citations
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          cd google_scholar_crawler
          python main.py

      - name: Publish citation data
        run: |
          mkdir publish

          cp google_scholar_crawler/results/gs_data_shieldsio.json \
             publish/gs_data_shieldsio.json

          cd publish

          git init
          git checkout -b google-scholar-stats

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update Google Scholar citations"

          git remote add origin \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

          git push --force origin google-scholar-stats
